aid: padsplit
name: PadSplit
description: >-
  PadSplit is an Atlanta-based co-living marketplace that makes affordable
  housing accessible by connecting members seeking private rooms in shared homes
  with property owners who host them. The platform offers flexible weekly
  payments, fast move-ins, all-inclusive rent (utilities, wifi, and furnishings),
  member background screening, and a rewards program that helps residents build
  credit. PadSplit operates across multiple U.S. metros as a two-sided
  marketplace serving both members (renters) and hosts (property owners), and was
  backed by Techstars. The company has no public developer program, API, or
  documentation surface at this time; this profile captures its identity and
  domain-security posture.
